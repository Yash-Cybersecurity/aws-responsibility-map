name: refresh
on:
  schedule: [{ cron: "0 3 * * 1" }]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scripts/fetch.py
      - run: python scripts/diff.py
      - name: Open PR if snapshots changed
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          if [ -n "$(git status --porcelain snapshots)" ]; then
            git config user.name "refresh-bot" && git config user.email "bot@users.noreply.github.com"
            B="refresh/$(date +%F)"; git checkout -b "$B"
            git add snapshots && git commit -m "Docs snapshot update"
            git push origin "$B"
            gh pr create --title "Docs changed $(date +%F)" --body-file snapshots/changes.md
          fi